name: kaizu

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: kaizu

    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: 123
    ports:
      - '8081:80'
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:123@postgres:5432/kaizu
      PORT: 3000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '3001:3001'
    depends_on:
      - backend

volumes:
  pgdata:
  pgadmin_data:
